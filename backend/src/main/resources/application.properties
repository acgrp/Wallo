# Runtime values are supplied by Render environment variables.
db.driverClassName=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
db.url=${DB_URL}
db.username=${DB_USERNAME}
db.password=${DB_PASSWORD}

ai.server.url=${AI_SERVER_URL:http://127.0.0.1:8000}
frontend.allowed-origin-patterns=${FRONTEND_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}
jwt.refresh-cookie-same-site=${JWT_REFRESH_COOKIE_SAME_SITE:Lax}
